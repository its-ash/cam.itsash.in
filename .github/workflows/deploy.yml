name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}-v1

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}-v1

      - name: Install JS dependencies
        run: npm install

      - name: Build WASM
        run: wasm-pack build --target web --out-dir pkg

      - name: Build site to docs/
        run: npm run build

      - name: Add .nojekyll
        run: touch docs/.nojekyll

      - name: Add CNAME
        run: echo "record.itsash.in" > docs/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Cancel stuck Pages deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Checking for in-progress GitHub Pages deployments..."
          for i in $(seq 1 6); do
            PENDING=$(gh api "repos/$REPO/pages" --jq '.status' 2>/dev/null || echo "unknown")
            echo "Attempt $i: Pages status = $PENDING"
            if [ "$PENDING" != "building" ] && [ "$PENDING" != "queued" ]; then
              echo "No stuck deployment. Proceeding."
              break
            fi
            echo "Deployment in progress, waiting 30s..."
            sleep 30
          done

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5