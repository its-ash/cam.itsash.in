[package]
name = "wasm-video-recorder"
version = "0.1.0"
edition = "2021"
description = "Rust + WebAssembly video recorder with optimal compression (AV1/VP9/H.264)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlVideoElement",
  "MediaStream",
  "MediaStreamTrack",
  "MediaRecorder",
  "MediaRecorderOptions",
  "MediaStreamConstraints",
  "MediaTrackSettings",
  "MediaDevices",
  "Blob",
  "BlobEvent",
  "Url",
  "BlobPropertyBag",
  "Event",
  "EventListener",
  "MessageEvent",
  "ErrorEvent",
  "DomException",
  "Navigator",
  "Performance",
  "File",
  "FileReader",
  "HtmlAnchorElement",
  "console",
] }
wee_alloc = "0.4"
tract-onnx = { version = "0.23.4", features = ["getrandom-js"] }
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
